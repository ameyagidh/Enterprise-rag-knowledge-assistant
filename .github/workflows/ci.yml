name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Run unit tests
        # No LLM API key is set here on purpose: integration tests are
        # marked `@pytest.mark.integration` and auto-skip without a key.
        run: pytest -m "not integration" --cov=rag_assistant --cov-report=term-missing
